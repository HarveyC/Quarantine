name: release
# Builds Windows, macOS and Linux zips and attaches them to a GitHub release.
# Push a tag like v0.1.0 to publish, or run it by hand from the Actions tab: give a version
# (e.g. v0.1.0) to publish a release with that tag, or leave it empty to only get the zips as artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create, e.g. v0.1.0 (empty = build only)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.4.1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_KEY: ${{ secrets.BUTLER_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot and export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cd ~/godot
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q godot.zip && rm godot.zip
          curl -sSL -o templates.tpz https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q templates.tpz && mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/ && rm -rf templates templates.tpz

      - name: Run tests
        run: GODOT=~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ./tests/run.sh

      - name: Pick version
        run: echo "VERSION=${{ inputs.version || github.ref_name }}" >> "$GITHUB_ENV"

      - name: Export and zip
        run: ./release/build.sh ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 "$VERSION"

      - name: Upload zips to the workflow run
        uses: actions/upload-artifact@v4
        with:
          name: quarantine-builds
          path: build/dist/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Download the zip for your computer, unzip, and run. Mac and Windows will warn that the game is unsigned; see HOW-TO-PLAY.txt inside the zip."
          if [ -f release/NOTES.md ]; then
            { cat release/NOTES.md; echo; echo "$NOTES"; } > build/notes.md
          else
            echo "$NOTES" > build/notes.md
          fi
          gh release create "$VERSION" build/dist/*.zip --target "$GITHUB_SHA" \
            --title "Quarantine $VERSION" \
            --notes-file build/notes.md

      - name: Push to itch.io
        if: (startsWith(github.ref, 'refs/tags/') || inputs.version != '') && env.HAS_KEY == 'true'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_TARGET: HarveyCl/${{ vars.ITCH_GAME || 'carriers' }}
        run: |
          curl -sSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
          ./butler/butler push build/windows "$ITCH_TARGET:windows" --userversion "$VERSION"
          ./butler/butler push build/linux "$ITCH_TARGET:linux" --userversion "$VERSION"
